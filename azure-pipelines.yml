trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - .gitignore
      - .github/*
      - LICENSE.md
      - README.md
      - assets/*

  tags:
    include:
      - v*

# PR always trigger build
pr:
  autoCancel: true

# add nf-tools repo to resources (for Azure Pipelines templates)
resources:
  repositories:
    - repository: templates
      type: github
      name: nanoframework/nf-tools
      endpoint: nanoframework

variables:
  - name: DOTNET_NOLOGO
    value: true  
  - name: nugetPackageName
    value: 'nanoFramework.NET.Sdk'

stages:

########################
- stage: Build
  jobs:
  - job: Build_SDK
    pool:
      vmImage: 'windows-latest'

    variables:
      - group: sign-client-credentials
      - name: buildPlatform
        value: 'Any CPU'  
      - name: buildConfiguration
        value: 'Release'
      - name: solution
        value: 'nanoFramework.NET.Sdk.sln'

    steps:
    - checkout: self
      submodules: true
      fetchDepth: 0

    - script: |
        git config --global user.email nanoframework@outlook.com
        git config --global user.name nfbot
        git config --global core.autocrlf true
      displayName: Setup git identity

    - template: azure-pipelines-templates/install-nbgv-tool.yml@templates

    # waiting for project to be public to enable SonarCloud analysis
    # - task: SonarCloudPrepare@3
    #   condition: >-
    #     and(
    #       succeeded(),
    #       eq(variables['StartReleaseCandidate'], false),
    #       not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v')),
    #       not(${{ parameters.skipSonarCloudAnalysis }})
    #     )
    #   displayName: 'Prepare analysis on SonarCloud'
    #   inputs:
    #     SonarCloud: 'sonarcloud-$(System.TeamProject)'
    #     organization: 'nanoframework'
    #     scannerMode: 'dotnet'
    #     projectKey: 'nanoframework_net-sdk'
    #     extraProperties: |
    #       sonar.exclusions=**/obj/**,**/*.dll
    #       sonar.cs.vscoveragexml.reportsPaths=$(Agent.TempDirectory)/**/**.coverage
    #       sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/**/**.trx
    #       sonar.scanner.skipJreProvisioning=true

    - template: azure-pipelines-templates/install-nuget.yml@templates

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) /p:PublicRelease=true'

    # waiting for project to be public to enable SonarCloud analysis
    # - task: SonarCloudAnalyze@3
    #   condition: >-
    #     and(
    #       succeeded(),
    #       eq(variables['StartReleaseCandidate'], false),
    #       not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    #     )
    #   displayName: 'Run Code Analysis'
    #   continueOnError: true

    # waiting for project to be public to enable SonarCloud analysis
    # - task: SonarCloudPublish@3
    #   condition: >-
    #     and(
    #       succeeded(),
    #       eq(variables['StartReleaseCandidate'], false),
    #       not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    #     )
    #   displayName: 'Publish Quality Gate Result'
    #   continueOnError: true

    - task: VisualStudioTestPlatformInstaller@1
      condition: succeeded()
      displayName: 'Install VS Test Platform'
      inputs:
        versionSelector: latestStable

    - task: VSTest@2
      condition: succeeded()
      displayName: 'Running Unit Tests'
      continueOnError: false
      inputs:
        testSelector: 'testAssemblies'
        testAssemblyVer2: |
          **\*Tests*.dll
          !**\obj\**
          !**\TestAdapter\**
        searchFolder: '$(System.DefaultWorkingDirectory)'
        platform: '$(BuildPlatform)'
        configuration: '$(BuildConfiguration)'
        diagnosticsEnabled: true
        vsTestVersion: toolsInstaller
        codeCoverageEnabled: true

    - task: DotNetCoreCLI@2
      displayName: Install Sign Client CLI
      condition: >-
        and(
          succeeded(),
          eq(variables['StartReleaseCandidate'], false),
          not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
        )
      inputs:
        command: custom
        custom: tool
        arguments: install --tool-path . sign --version 0.9.1-beta.23530.1

    - pwsh: |
        .\sign code azure-key-vault `
        "**/nanoFramework.Tools.BuildTasks.*" `
        --base-directory "$(Build.SourcesDirectory)/nanoFramework.NET.Sdk/build/Release" `
        --description "$(Build.Repository.Name)" `
        --description-url "https://github.com/$(Build.Repository.Name)" `
        --azure-key-vault-tenant-id "$(SignTenantId)" `
        --azure-key-vault-client-id "$(SignClientId)" `
        --azure-key-vault-client-secret "$(SignClientSecret)" `
        --azure-key-vault-certificate "$(SignKeyVaultCertificate)" `
        --azure-key-vault-url "$(SignKeyVaultUrl)" `
        --timestamp-url http://timestamp.digicert.com
      displayName: Sign DLLs
      continueOnError: false
      condition: >-
        and(
          succeeded(),
          eq(variables['StartReleaseCandidate'], false),
          not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
        )

    - task: DotNetCoreCLI@2
      displayName: Pack
      inputs:
        command: 'pack'
        packagesToPack: '**/nanoFramework.NET.Sdk.csproj'
        versioningScheme: 'off'
        arguments: '--configuration $(buildConfiguration) /p:PublicRelease=true --output $(Build.ArtifactStagingDirectory)'

    - pwsh: |
        .\sign code azure-key-vault `
        "**/*.nupkg" `
        --base-directory "$(Build.ArtifactStagingDirectory)" `
        --description "$(Build.Repository.Name)" `
        --description-url "https://github.com/$(Build.Repository.Name)" `
        --azure-key-vault-tenant-id "$(SignTenantId)" `
        --azure-key-vault-client-id "$(SignClientId)" `
        --azure-key-vault-client-secret "$(SignClientSecret)" `
        --azure-key-vault-certificate "$(SignKeyVaultCertificate)" `
        --azure-key-vault-url "$(SignKeyVaultUrl)" `
        --timestamp-url http://timestamp.digicert.com
      displayName: Sign NuGet package
      continueOnError: true
      condition: >-
        and(
          succeeded(),
          eq(variables['StartReleaseCandidate'], false),
          not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
        )

    - task: PublishPipelineArtifact@1
      displayName: Publish NuGet package
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'NuGetPackage'
        artifactType: pipeline

    - task: PowerShell@2
      displayName: Create NuGet config for SmokeTest
      inputs:
        targetType: inline
        script: |
          $nugetConfig = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<configuration>'
            '  <packageSources>'
            '    <clear />'
            '    <add key="local-sdk" value="$(Build.ArtifactStagingDirectory)" />'
            '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />'
            '  </packageSources>'
            '</configuration>'
          )
          $nugetConfig | Set-Content -Path "$(Build.SourcesDirectory)/test/SmokeTest/NuGet.Azdo.Config"

    - task: DotNetCoreCLI@2
      displayName: Restore SmokeTest
      inputs:
        command: 'restore'
        projects: 'test/SmokeTest/SmokeTest.csproj'
        feedsToUse: 'config'
        nugetConfigPath: '$(Build.SourcesDirectory)/test/SmokeTest/NuGet.Azdo.Config'

    - task: DotNetCoreCLI@2
      displayName: Build SmokeTest
      inputs:
        command: 'build'
        projects: 'test/SmokeTest/SmokeTest.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: PowerShell@2
      displayName: Validate SmokeTest native checksum
      inputs:
        targetType: inline
        script: |
          $expectedChecksum = '0x1DA81E42'
          $actualChecksum = $env:NF_NATIVE_ASSEMBLY_CHECKSUM

          if ($actualChecksum -ine $expectedChecksum)
          {
            Write-Host "##vso[task.logissue type=error]Smoke test assembly checksum mismatch: expected $expectedChecksum but got '$actualChecksum'."
            exit 1
          }

          Write-Host "Smoke test assembly checksum matches expected value: $expectedChecksum."
    
    - task: NuGetCommand@2
      condition: >-
        and(
          succeeded(),
          eq(variables['System.PullRequest.PullRequestId'], ''),
          not(startsWith(variables['Build.SourceBranch'], 'refs/pull/')),
          eq(variables['StartReleaseCandidate'], false),
          not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
        )
      continueOnError: true
      displayName: Push NuGet package to NuGet
      inputs:
        command: push
        nuGetFeedType: external
        allowPackageConflicts: true
        packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
        publishFeedCredentials: 'NuGet-$(System.TeamProject)'

# report build failure to Discord
- stage: Report_Build_Failure
  dependsOn: Build
  condition: failed('Build')

  jobs:
  - job: Report_Build_Failure
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      fetchDepth: 1

    # step from template @ nf-tools repo
    - template: azure-pipelines-templates/discord-webhook.yml@templates
      parameters:
        status: 'failure'
        webhookUrl: '$(DiscordWebhook)'
        message: ''
