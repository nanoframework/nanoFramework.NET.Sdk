trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - .gitignore
      - .github/*
      - LICENSE.md
      - README.md
      - assets/*

# PR always trigger build
pr:
  autoCancel: true

# add nf-tools repo to resources (for Azure Pipelines templates)
resources:
  repositories:
    - repository: templates
      type: github
      name: nanoframework/nf-tools
      endpoint: nanoframework

variables:
  - name: DOTNET_NOLOGO
    value: true  
  - name: nugetPackageName
    value: 'nanoFramework.NET.Sdk'

stages:

########################
- stage: Build
  jobs:
  - job: Build_SDK
    pool:
      vmImage: 'windows-latest'

    variables:
      - group: sign-client-credentials
      - name: buildPlatform
        value: 'Any CPU'  
      - name: buildConfiguration
        value: 'Release'
      - name: solution
        value: 'nanoFramework.NET.Sdk.sln'

    steps:
    - checkout: self
      submodules: true
      fetchDepth: 0

    - script: |
        git config --global user.email nanoframework@outlook.com
        git config --global user.name nfbot
        git config --global core.autocrlf true
      displayName: Setup git identity

    # waiting for project to be public to enable SonarCloud analysis
    # - task: SonarCloudPrepare@3
    #   condition: >-
    #     and(
    #       succeeded(),
    #       not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v')),
    #       not(${{ parameters.skipSonarCloudAnalysis }})
    #     )
    #   displayName: 'Prepare analysis on SonarCloud'
    #   inputs:
    #     SonarCloud: 'sonarcloud-$(System.TeamProject)'
    #     organization: 'nanoframework'
    #     scannerMode: 'dotnet'
    #     projectKey: 'nanoframework_net-sdk'
    #     extraProperties: |
    #       sonar.exclusions=**/obj/**,**/*.dll
    #       sonar.cs.vscoveragexml.reportsPaths=$(Agent.TempDirectory)/**/**.coverage
    #       sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/**/**.trx
    #       sonar.scanner.skipJreProvisioning=true

    - template: azure-pipelines-templates/install-nuget.yml@templates

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) /p:PublicRelease=true'

    # waiting for project to be public to enable SonarCloud analysis
    # - task: SonarCloudAnalyze@3
    #   condition: >-
    #     and(
    #       succeeded(),
    #       not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    #     )
    #   displayName: 'Run Code Analysis'
    #   continueOnError: true

    # waiting for project to be public to enable SonarCloud analysis
    # - task: SonarCloudPublish@3
    #   condition: >-
    #     and(
    #       succeeded(),
    #       not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    #     )
    #   displayName: 'Publish Quality Gate Result'
    #   continueOnError: true

    - task: VisualStudioTestPlatformInstaller@1
      condition: succeeded()
      displayName: 'Install VS Test Platform'
      inputs:
        versionSelector: latestStable

    - task: VSTest@2
      condition: succeeded()
      displayName: 'Running Unit Tests'
      continueOnError: false
      inputs:
        testSelector: 'testAssemblies'
        testAssemblyVer2: |
          **\*Tests*.dll
          !**\obj\**
          !**\TestAdapter\**
        searchFolder: '$(System.DefaultWorkingDirectory)'
        platform: '$(BuildPlatform)'
        configuration: '$(BuildConfiguration)'
        diagnosticsEnabled: true
        vsTestVersion: toolsInstaller
        codeCoverageEnabled: true

    - task: DotNetCoreCLI@2
      displayName: Install Sign Client CLI
      condition: >-
        and(
          succeeded(),
          not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
        )
      inputs:
        command: custom
        custom: tool
        arguments: install --tool-path . sign --version 0.9.1-beta.23530.1

    - pwsh: |
        .\sign code azure-key-vault `
        "*/bin/$(buildConfiguration)/**/nanoFramework.*.dll" `
        --base-directory "$(Build.SourcesDirectory)" `
        --description "$(Build.Repository.Name)" `
        --description-url "https://github.com/$(Build.Repository.Name)" `
        --azure-key-vault-tenant-id "$(SignTenantId)" `
        --azure-key-vault-client-id "$(SignClientId)" `
        --azure-key-vault-client-secret "$(SignClientSecret)" `
        --azure-key-vault-certificate "$(SignKeyVaultCertificate)" `
        --azure-key-vault-url "$(SignKeyVaultUrl)" `
        --timestamp-url http://timestamp.digicert.com
      displayName: Sign DLLs
      continueOnError: false
      condition: >-
        and(
          succeeded(),
          not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
        )

    - task: DotNetCoreCLI@2
      displayName: Pack
      condition: succeeded()
      inputs:
        command: 'pack'
        packagesToPack: '**/nanoFramework.NET.Sdk.csproj'
        versioningScheme: 'off'
        arguments: '--configuration $(buildConfiguration) /p:PublicRelease=true --output $(Build.ArtifactStagingDirectory)'

    - task: PublishPipelineArtifact@1
      displayName: Publish NuGet package
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'NuGetPackage'
        artifactType: pipeline

- stage: SmokeTest
  dependsOn: Build
  jobs:
  - job: SmokeTest
    pool:
      vmImage: 'windows-latest'

    variables:
      - name: buildPlatform
        value: 'Any CPU'
      - name: buildConfiguration
        value: 'Release'

    steps:
    - checkout: self
      submodules: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Download SDK package for SmokeTest
      inputs:
        artifact: 'NuGetPackage'
        path: '$(Build.ArtifactStagingDirectory)'

    - task: PowerShell@2
      displayName: Create NuGet config for SmokeTest
      inputs:
        targetType: filePath
        filePath: 'test/SmokeTest/Create-NuGetConfig.ps1'
        arguments: '-PackageDirectory "$(Build.ArtifactStagingDirectory)" -SmokeTestDirectory "$(Build.SourcesDirectory)\test\SmokeTest" -ForceGlobalJson -ForceNuGetConfig'

    - task: PowerShell@2
      displayName: Isolate SmokeTest NuGet package cache
      inputs:
        targetType: inline
        script: |
          $cacheDirectory = Join-Path "$(Agent.TempDirectory)" ("nf-smoketest-nuget-" + [Guid]::NewGuid().ToString('N'))
          Write-Host "##vso[task.setvariable variable=NUGET_PACKAGES]$cacheDirectory"
          Write-Host "##vso[task.setvariable variable=NF_SMOKETEST_NUGET_PACKAGES]$cacheDirectory"
          Write-Host "SmokeTest NuGet cache: $cacheDirectory"

    - task: DotNetCoreCLI@2
      displayName: Restore SmokeTest
      inputs:
        command: 'restore'
        projects: 'test/SmokeTest/SmokeTest.csproj'
        feedsToUse: 'config'
        nugetConfigPath: '$(Build.SourcesDirectory)\test\SmokeTest\NuGet.Azdo.Config'

    - task: PowerShell@2
      displayName: Verify SmokeTest SDK package
      inputs:
        targetType: inline
        script: |
          $package = Get-ChildItem -LiteralPath "$(Build.ArtifactStagingDirectory)" -Filter "nanoFramework.NET.Sdk.*.nupkg" -File |
            Where-Object { $_.Name -notlike "*.snupkg" -and $_.Name -notlike "*.symbols.nupkg" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $package)
          {
            throw "Couldn't find the freshly packed SDK package in $(Build.ArtifactStagingDirectory)."
          }

          $match = [regex]::Match($package.BaseName, '^nanoFramework\.NET\.Sdk\.(.+)$')
          if (-not $match.Success)
          {
            throw "Couldn't infer SDK version from package '$($package.Name)'."
          }

          $sdkVersion = $match.Groups[1].Value
          $resolvedPackageDirectory = Join-Path $env:NUGET_PACKAGES "nanoframework.net.sdk\$sdkVersion"
          $resolvedPackage = Join-Path $resolvedPackageDirectory "nanoframework.net.sdk.$sdkVersion.nupkg"
          if (-not (Test-Path -LiteralPath $resolvedPackage -PathType Leaf))
          {
            throw "The freshly packed SDK wasn't restored into the isolated NuGet cache: $resolvedPackage"
          }

          $packedHash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
          $restoredHash = (Get-FileHash -LiteralPath $resolvedPackage -Algorithm SHA256).Hash
          if ($packedHash -ne $restoredHash)
          {
            throw "The SDK package in the isolated NuGet cache doesn't match '$($package.Name)'."
          }

          Write-Host "Verified SmokeTest uses freshly packed SDK package: $($package.Name) (SHA256 $packedHash)"

    - task: DotNetCoreCLI@2
      displayName: Build SmokeTest (dotnet build)
      inputs:
        command: 'build'
        projects: 'test/SmokeTest/SmokeTest.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: VSBuild@1
      displayName: Build SmokeTest (MSBuild)
      inputs:
        solution: 'test/SmokeTest/SmokeTest.csproj'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
        vsVersion: 'latest'
        msbuildArgs: '/t:Build /p:Restore=false'

    - task: PowerShell@2
      displayName: Validate SmokeTest native contract hash
      inputs:
        targetType: inline
        script: |
          $expectedHash = '0xDB9A80D9'
          $actualHash = $env:NF_NATIVE_CONTRACT_HASH

          if ($actualHash -ine $expectedHash)
          {
            Write-Host "##vso[task.logissue type=error]Smoke test native contract hash mismatch: expected $expectedHash but got '$actualHash'."
            exit 1
          }

          Write-Host "Smoke test native contract hash matches expected value: $expectedHash."

    - task: PowerShell@2
      displayName: Validate SmokeTest resource parity
      inputs:
        targetType: filePath
        filePath: 'test/SmokeTest/Verify-Parity.ps1'
        arguments: '-Configuration $(buildConfiguration)'

    - task: PowerShell@2
      displayName: Remove isolated SmokeTest NuGet cache
      condition: always()
      inputs:
        targetType: inline
        script: |
          $cacheDirectory = $env:NF_SMOKETEST_NUGET_PACKAGES
          if ([string]::IsNullOrWhiteSpace($cacheDirectory))
          {
            return
          }

          $agentTempDirectory = [System.IO.Path]::GetFullPath("$(Agent.TempDirectory)").TrimEnd('\')
          $cacheDirectory = [System.IO.Path]::GetFullPath($cacheDirectory)
          $cacheParent = Split-Path -Parent $cacheDirectory
          $cacheName = Split-Path -Leaf $cacheDirectory
          if ($cacheParent -ne $agentTempDirectory -or $cacheName -notmatch '^nf-smoketest-nuget-[0-9a-f]{32}$')
          {
            throw "Refusing to remove unexpected SmokeTest NuGet cache path: $cacheDirectory"
          }

          if (Test-Path -LiteralPath $cacheDirectory)
          {
            Remove-Item -LiteralPath $cacheDirectory -Recurse -Force
          }

- stage: Release_Publish
  dependsOn: SmokeTest
  condition: >-
    and(
      succeeded(),
      eq(variables['System.PullRequest.PullRequestId'], ''),
      not(startsWith(variables['Build.SourceBranch'], 'refs/pull/')),
      not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v')),
      eq(variables['StartReleaseCandidate'], false),
      or(
        eq(variables['Build.SourceBranchName'], 'main'),
        eq(variables['Build.SourceBranchName'], 'develop')
      )
    )
  jobs:
  - job: Release_Publish
    pool:
      vmImage: 'windows-latest'

    variables:
      - group: sign-client-credentials

    steps:
    - checkout: self
      fetchDepth: 1

    - task: DownloadPipelineArtifact@2
      displayName: Download SDK package for release
      inputs:
        artifact: 'NuGetPackage'
        path: '$(Build.ArtifactStagingDirectory)'

    - task: PowerShell@2
      displayName: Set SDK release version
      inputs:
        targetType: inline
        script: |
          $package = Get-ChildItem -LiteralPath "$(Build.ArtifactStagingDirectory)" -Filter "$(nugetPackageName).*nupkg" -File |
            Where-Object { $_.Name -notlike "*.snupkg" -and $_.Name -notlike "*.symbols.nupkg" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $package)
          {
            throw "Couldn't find $(nugetPackageName) package in $(Build.ArtifactStagingDirectory)."
          }

          $packageName = [regex]::Escape("$(nugetPackageName)")
          $match = [regex]::Match($package.BaseName, "^$packageName\.(.+)$")

          if (-not $match.Success)
          {
            throw "Couldn't infer SDK version from package '$($package.Name)'."
          }

          $sdkVersion = $match.Groups[1].Value
          Write-Host "Using SDK release version: $sdkVersion"
          Write-Host "##vso[task.setvariable variable=MY_NUGET_VERSION]$sdkVersion"

    - template: azure-pipelines-templates/class-lib-publish.yml@templates
      parameters:
        baseBranchName: 'main'

    - template: azure-pipelines-templates/create-github-release.yml@templates

# report build failure to Discord
- stage: Report_Build_Failure
  dependsOn:
    - Build
    - SmokeTest
    - Release_Publish
  condition: or(failed('Build'), failed('SmokeTest'), failed('Release_Publish'))

  jobs:
  - job: Report_Build_Failure
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      fetchDepth: 1

    # step from template @ nf-tools repo
    - template: azure-pipelines-templates/discord-webhook.yml@templates
      parameters:
        status: 'failure'
        webhookUrl: '$(DiscordWebhook)'
        message: ''
